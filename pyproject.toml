[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-clone"
version = "0.1.0"
description = "Personalized Short-Form Video Behavior Cloning Agent for Instagram Reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "open-clip-torch>=2.26.1",
    "transformers>=4.44.0",
    "playwright>=1.47.0",
    "mss>=9.0.1",
    "rapidocr-onnxruntime>=1.3.24",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
windows-audio = [
    "PyAudioWPatch>=0.2.12.6",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.setuptools.package-data]
reel_clone = ["memory/*.sql"]
